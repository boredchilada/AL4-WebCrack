name: WebCrack
version: $SERVICE_TAG
description: >-
  Deobfuscates, unminifies and unpacks JavaScript with webcrack. Resubmits deobfuscated code and
  embedded WebAssembly for further analysis, and tags URLs, domains and IPs found in the result.
  Static only: behavioural JavaScript detection is JsJaws's job.

accepts: code/javascript|code/html|code/jscript|code/wsf|image/svg
rejects: empty|metadata/.*
stage: CORE
category: Static Analysis
file_required: true
timeout: 120
disable_cache: false
enabled: true
is_external: false
privileged: false

config:
  max_deobfuscated_size: 10485760

submission_params:
  - name: deobfuscate_code
    type: bool
    default: true
    value: true
  - name: unminify_code
    type: bool
    default: true
    value: true
  - name: unpack_bundles
    type: bool
    default: true
    value: true

heuristics:
  - heur_id: 1
    name: Obfuscated JavaScript deobfuscated
    score: 100
    filetype: code/.*
    description: webcrack changed the code beyond whitespace, so it was obfuscated or minified.
    attack_id:
      - T1027
  - heur_id: 2
    name: Known obfuscator detected
    score: 500
    filetype: code/.*
    description: Markers of a known JavaScript obfuscator such as obfuscator.io.
    attack_id:
      - T1027.013
  - heur_id: 3
    name: JavaScript bundle detected
    score: 50
    filetype: code/.*
    description: A webpack or browserify bundle was found and unpacked.
  - heur_id: 4
    name: Embedded WebAssembly detected
    score: 500
    filetype: code/.*
    description: >-
      Base64-encoded WebAssembly inside JavaScript, a way to hide logic such as cryptomining from
      text-based scanners. The binaries are extracted for WasmAnalyzer.
    attack_id:
      - T1027.009

docker_config:
  image: ghcr.io/boredchilada/al4-webcrack:$SERVICE_TAG
  cpu_cores: 1.0
  ram_mb: 4096
  allow_internet_access: false
