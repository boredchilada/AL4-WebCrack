name: release
on:
  push:
    tags: ["v4.7.*"]

permissions:
  contents: read

jobs:
  publish:
    # Inert on Forgejo; active once the repo moves to GitHub.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate tag and derive version and image
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$tag" =~ ^v4\.7\.[0-9]+\.(stable|dev)[0-9]+$ ]] || { echo "tag $tag must look like v4.7.0.stable1 or v4.7.0.dev1"; exit 1; }
          image=$(sed -nE 's|^ *image: (ghcr\.io/[^:]+):\$SERVICE_TAG$|\1|p' service_manifest.yml)
          test -n "$image" || { echo "manifest image must be ghcr.io/<path>:\$SERVICE_TAG"; exit 1; }
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - run: bash scripts/build-image.sh "$IMAGE:$VERSION" "$VERSION"
      - run: bash scripts/ci-gate.sh "$IMAGE:$VERSION"

      # docker/login-action v4.6.0, pinned by commit
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE:$VERSION"
