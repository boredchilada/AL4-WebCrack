name: ci
on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/build-image.sh svc:ci 4.7.0.dev0
      - run: bash scripts/ci-gate.sh svc:ci
