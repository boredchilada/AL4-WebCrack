name: release
on:
  push:
    tags: ["v4.7.*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Registry push endpoint, from the Forgejo Actions variable PUSH_REGISTRY (set on the org).
      # Kept out of the repo so public copies carry no internal addresses.
      PUSH_REGISTRY: ${{ vars.PUSH_REGISTRY }}
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate tag and derive version and image
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUSH_REGISTRY" || { echo "Forgejo Actions variable PUSH_REGISTRY is not set"; exit 1; }
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$tag" =~ ^v4\.7\.[0-9]+\.(stable|dev)[0-9]+$ ]] || { echo "tag $tag must look like v4.7.0.stable1 or v4.7.0.dev1"; exit 1; }
          image=$(sed -nE 's|^ *image: \$\{PRIVATE_REGISTRY\}([^:]+):\$SERVICE_TAG$|\1|p' service_manifest.yml)
          test -n "$image" || { echo "manifest image must be \${PRIVATE_REGISTRY}<path>:\$SERVICE_TAG"; exit 1; }
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "IMAGE=$PUSH_REGISTRY/$image" >> "$GITHUB_ENV"

      - run: bash scripts/build-image.sh "$IMAGE:$VERSION" "$VERSION"
      - run: bash scripts/ci-gate.sh "$IMAGE:$VERSION"

      - name: Push
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USERNAME" && test -n "$REGISTRY_TOKEN"
          printf '%s' "$REGISTRY_TOKEN" | docker login "$PUSH_REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          trap 'docker logout "$PUSH_REGISTRY"' EXIT
          docker push "$IMAGE:$VERSION"
